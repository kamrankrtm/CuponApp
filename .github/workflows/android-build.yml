name: ساخت اپلیکیشن اندروید

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # پیش‌فرض این اکشن پکیج منسوخ‌شده «tools» را نصب می‌کند و شکست می‌خورد.
          # SDK پایه از قبل روی رانر نصب است و AGP بقیه را خودش دانلود می‌کند.
          packages: ''

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build web assets
        run: bunx vite build

      - name: Sync Capacitor Android project
        run: bunx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
             "artifacts/cuponapp-${GITHUB_SHA::7}.apk"
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuponapp-apk
          path: artifacts/*.apk
          retention-days: 90

      - name: Publish rolling release
        if: github.ref == 'refs/heads/claude/eloquent-euler-81lcce' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: آخرین نسخه نصبی تخفیف‌یاب
          body: |
            ## تخفیف‌یاب پیامکی — نسخه نصبی اندروید

            فایل APK زیر را روی گوشی اندروید دانلود و نصب کنید.

            **پیش از استفاده:**
            1. هنگام اولین اجرا، مجوز «خواندن پیامک» را بدهید.
            2. از دکمه تنظیمات (گوشه پایین-چپ) کلید API اول‌ای‌آی خود را وارد کنید.
            3. دکمه «اسکن پیامک‌ها» را بزنید.

            **حریم خصوصی:** پیامک‌های شخصی، بانکی و رمزهای یک‌بارمصرف
            روی خود گوشی جدا می‌شوند و هرگز به سرویس هوش مصنوعی ارسال نمی‌گردند.

            کامیت: `${{ github.sha }}`
          files: artifacts/*.apk
          prerelease: false
          make_latest: true
