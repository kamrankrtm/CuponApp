name: ساخت اپلیکیشن اندروید

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: version
        run: |
          # شماره اجرا به عنوان نسخه: هر بیلد یک نسخه بالاتر از قبلی
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "نسخه این بیلد: $VERSION"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # پیش‌فرض این اکشن پکیج منسوخ‌شده «tools» را نصب می‌کند و شکست می‌خورد.
          # SDK پایه از قبل روی رانر نصب است و AGP بقیه را خودش دانلود می‌کند.
          packages: ''

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build web assets
        run: bunx vite build

      - name: Sync Capacitor Android project
        run: bunx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 تنظیم نشده — APK با کلید موقت debug امضا می‌شود و روی نسخه قبلی نصب نخواهد شد."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/cuponapp-release.keystore
          echo "کلید امضا بازیابی شد ($(stat -c%s android/app/cuponapp-release.keystore) بایت)"

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          # اثر انگشت کلید را چاپ می‌کنیم تا در هر بیلد قابل مقایسه باشد؛
          # اگر بین دو نسخه فرق کند، نصب روی نسخه قبلی شکست می‌خورد.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs \
            android/app/build/outputs/apk/release/app-release.apk \
            | grep -i "SHA-256 digest" || echo "امضا قابل خواندن نبود"

      - name: Remove signing key
        if: always()
        run: rm -f android/app/cuponapp-release.keystore

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
             "artifacts/cuponapp-${{ steps.version.outputs.version }}.apk"
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuponapp-apk
          path: artifacts/*.apk
          retention-days: 90

      - name: Publish release
        if: github.ref == 'refs/heads/claude/eloquent-euler-81lcce' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: نسخه ${{ steps.version.outputs.version }}
          body: |
            ## تخفیف‌یاب پیامکی — نسخه ${{ steps.version.outputs.version }}

            فایل APK زیر را روی گوشی اندروید دانلود و نصب کنید.
            اگر نسخه قبلی نصب است، همین فایل روی آن نصب می‌شود و
            داده‌هایتان حفظ می‌ماند.

            **حریم خصوصی:** پیامک‌های شخصی، بانکی و رمزهای یک‌بارمصرف
            روی خود گوشی جدا می‌شوند و هرگز به سرویس هوش مصنوعی ارسال نمی‌گردند.

            کامیت: `${{ github.sha }}`
          files: artifacts/*.apk
          prerelease: false
          make_latest: true
