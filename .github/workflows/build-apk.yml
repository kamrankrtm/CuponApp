name: Build CuponApp APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
    # A push that only touches docs or the screenshot tooling has nothing new to release.
    paths-ignore:
      - 'README.md'
      - 'assets/**'
      - '.github/shots-request'
      - '.github/scripts/**'
      - '.github/workflows/ui-screenshots.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Make Gradle script executable
        run: chmod +x ./gradlew

      # gradle.properties holds the app version and the run number makes every build unique
      # (3.0.5.61). The installed app compares its own version with the latest release tag.
      - name: Work out the version
        id: version
        run: |
          base=$(sed -n 's/^appVersionName=//p' gradle.properties | tr -d '[:space:]')
          echo "name=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK (noAnalytics)
        run: ./gradlew assembleNoAnalyticsDebug -PbuildNumber=${{ github.run_number }} --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          find presentation/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/CuponApp-debug.apk \;
          cp build-output/CuponApp-debug.apk build-output/smsPRO-debug.apk
          cp build-output/CuponApp-debug.apk "build-output/smsPRO-${{ steps.version.outputs.name }}.apk"
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smsPRO-debug-apk
          path: build-output/CuponApp-debug.apk
          retention-days: 30

      # Plain text, because the in-app update dialog shows the notes as they are
      - name: Write release notes
        if: github.ref == 'refs/heads/main'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          {
            echo "نسخه $VERSION"
            echo
            printf '%s\n' "$COMMIT_MSG" \
              | sed -E '/^(Co-Authored-By|Claude-Session|Signed-off-by):/d; s/ *\[(shots|skip ci)\]//g'
            echo
            echo "نصب: فایل CuponApp-debug.apk را دانلود و روی گوشی نصب کنید."
          } | cat -s > release-notes.txt
          cat release-notes.txt

      - name: Create GitHub Release (on every main push)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          # The app reads this tag from releases/latest and offers the update when it is
          # higher than its own version name
          tag_name: v${{ steps.version.outputs.name }}
          name: smsPRO ${{ steps.version.outputs.name }}
          body_path: release-notes.txt
          files: |
            build-output/CuponApp-debug.apk
            build-output/smsPRO-debug.apk
            build-output/smsPRO-${{ steps.version.outputs.name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
