name: Build CuponApp APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle script executable
        run: chmod +x ./gradlew

      - name: Build Debug APK (noAnalytics)
        run: ./gradlew assembleNoAnalyticsDebug --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          find presentation/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/smsPRO-2.0.2.apk \;
          cp build-output/smsPRO-2.0.2.apk build-output/smsPRO-debug.apk
          cp build-output/smsPRO-2.0.2.apk build-output/CuponApp-debug.apk
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smsPRO-debug-apk
          path: build-output/smsPRO-2.0.2.apk
          retention-days: 30

      - name: Create GitHub Release (on every main push)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.2-${{ github.run_number }}
          name: smsPRO v2.0.2 (build ${{ github.run_number }})
          body: |
            ## smsPRO v2.0.2 - Fix SMS Sending Crash & Dual-SIM Support

            ### 🐛 رفع باگ‌های مهم
            - **رفع کرش ارسال پیامک**: خطای `Realm access from incorrect thread` در هنگام ارسال SMS به طور کامل برطرف شد.
            - **پشتیبانی دوسیم‌کارت**: ارسال پیامک از طریق سیم‌کارت پیش‌فرض در گوشی‌های دوسیم‌کارت اصلاح شد.
            - **پاک‌سازی شماره مقصد**: ارقام فارسی/عربی و کاراکترهای غیرمجاز قبل از ارسال پاکسازی می‌شوند.
            - **ارتقاء SDK به 33**: سازگاری با اندروید ۱۳+ بهبود یافت.

            ### 📱 نصب
            فایل `smsPRO-2.0.2.apk` را دانلود و روی گوشی نصب کنید.
          files: |
            build-output/smsPRO-2.0.2.apk
            build-output/smsPRO-debug.apk
            build-output/CuponApp-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
