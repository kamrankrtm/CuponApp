name: Build CuponApp APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Make Gradle script executable
        run: chmod +x ./gradlew

      - name: Build Debug APK (noAnalytics)
        run: ./gradlew assembleNoAnalyticsDebug --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          find presentation/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/smsPRO-1.0.15.apk \;
          cp build-output/smsPRO-1.0.15.apk build-output/smsPRO-debug.apk
          cp build-output/smsPRO-1.0.15.apk build-output/CuponApp-debug.apk
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smsPRO-debug-apk
          path: build-output/smsPRO-1.0.15.apk
          retention-days: 30

      - name: Create GitHub Release (on every main push)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.15-${{ github.run_number }}
          name: smsPRO v1.0.15 (build ${{ github.run_number }})
          body: |
            ## smsPRO v1.0.15 - AI Discount Extraction Hub & Shamsi Jalali Calendar Update
            - **AI Discount Extraction Hub**: Integrated AvalAI / OpenAI compatible AI coupon extractor with search bar and category chips (Food, Shopping, Travel, Entertainment)
            - **Main Settings AI Section**: Added API key input, base URL, model selection, live connection test, and full inbox AI scan
            - **Shamsi Solar Calendar Everywhere**: All tabs (All, Personal, Banking, OTP, Discounts, Spam) now display timestamps formatted in the Iranian Solar Jalali calendar
            - **Mark All Read**: Instant 1-tap button on toolbar to mark all unread conversations and messages as read
            - **Clean Discount Notifications**: Standardized clean notification styling matching other SMS messages with an ON/OFF toggle in Settings
            - **Brand Cleanup**: Replaced all remaining user-facing references to QKSMS with smsPRO
          files: |
            build-output/smsPRO-1.0.15.apk
            build-output/smsPRO-debug.apk
            build-output/CuponApp-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

