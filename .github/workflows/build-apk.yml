name: Build CuponApp APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Make Gradle script executable
        run: chmod +x ./gradlew

      - name: Build Debug APK (noAnalytics)
        run: ./gradlew assembleNoAnalyticsDebug --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          find presentation/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/smsPRO-1.0.13.apk \;
          cp build-output/smsPRO-1.0.13.apk build-output/smsPRO-debug.apk
          cp build-output/smsPRO-1.0.13.apk build-output/CuponApp-debug.apk
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smsPRO-debug-apk
          path: build-output/smsPRO-1.0.13.apk
          retention-days: 30

      - name: Create GitHub Release (on every main push)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.13-${{ github.run_number }}
          name: smsPRO v1.0.13 (build ${{ github.run_number }})
          body: |
            ## smsPRO v1.0.13 - Samsung S25 / Launch Crash Fix
            - Fixed MaterialComponents theme crash on launch (TabLayout + missing theme attrs)
            - Upgraded Material library to 1.3.0 for Bridge theme support
            - Hardcoded TabLayout colors to avoid attr resolution crashes
            - Hardened ReceiveSms and notification Call action against null/empty data
          files: |
            build-output/smsPRO-1.0.13.apk
            build-output/smsPRO-debug.apk
            build-output/CuponApp-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
