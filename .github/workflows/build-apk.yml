name: Build CuponApp APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Make Gradle script executable
        run: chmod +x ./gradlew

      - name: Build Debug APK (noAnalytics)
        run: ./gradlew assembleNoAnalyticsDebug --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          find presentation/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/smsPRO-2.0.1.apk \;
          cp build-output/smsPRO-2.0.1.apk build-output/smsPRO-debug.apk
          cp build-output/smsPRO-2.0.1.apk build-output/CuponApp-debug.apk
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smsPRO-debug-apk
          path: build-output/smsPRO-2.0.1.apk
          retention-days: 30

      - name: Create GitHub Release (on every main push)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.1-${{ github.run_number }}
          name: smsPRO v2.0.1 (build ${{ github.run_number }})
          body: |
            ## smsPRO v2.0.1 - Real Timestamps for OTPs & Promos, 1-Month Default Expiry, Contact Name Fix & Sending Watchdog
            - **Real Timestamps for OTP Codes**: Only codes received today are marked as Active; previous days are properly marked Expired with real Jalali timestamps.
            - **No More "اطلاع ثانوی"**: Discounts with unstated expiry are dynamically assigned a clear 1-month validity period in Jalali Shamsi.
            - **Instant Tab Switching & Scroll-to-Top**: Tab touch immediately scrolls to top; startup spam flicker fully eliminated.
            - **Contact Name Matching**: Normalized 09... and +98... lookup across all phone languages.
            - **SMS Sending Watchdog**: 20-second automatic resolution prevents messages from freezing on "Sending...".
          files: |
            build-output/smsPRO-2.0.1.apk
            build-output/smsPRO-debug.apk
            build-output/CuponApp-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
