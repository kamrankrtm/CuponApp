name: Build CuponApp APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Make Gradle script executable
        run: chmod +x ./gradlew

      - name: Build Debug APK (noAnalytics)
        run: ./gradlew assembleNoAnalyticsDebug --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          find presentation/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/smsPRO-2.0.0.apk \;
          cp build-output/smsPRO-2.0.0.apk build-output/smsPRO-debug.apk
          cp build-output/smsPRO-2.0.0.apk build-output/CuponApp-debug.apk
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smsPRO-debug-apk
          path: build-output/smsPRO-2.0.0.apk
          retention-days: 30

      - name: Create GitHub Release (on every main push)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0-${{ github.run_number }}
          name: smsPRO v2.0.0 (build ${{ github.run_number }})
          body: |
            ## smsPRO v2.0.0 - Major Release: AI Promo Extraction Hub, Shamsi Jalali Calendar & Modern Inbox
            - **AI Discount Extraction Hub**: Integrated AvalAI / OpenAI compatible AI discount engine directly in the Discounts tab with search bar and category chips (Food, Shopping, Travel, Entertainment)
            - **AI Main Settings Hub**: Direct configuration for API Key, Endpoint, Model Selection, live connection test, and full inbox AI scan
            - **Jalali Shamsi Calendar Everywhere**: Native Iranian Solar calendar timestamps across all tabs (All, Personal, Banking, OTP, Discounts, Spam)
            - **Mark All Read**: Instant 1-tap toolbar button to mark all unread conversations and messages as read
            - **Clean SMS Notifications**: Standardized clean notification design matching other messages with on/off toggle in settings
            - **Brand Refresh**: Clean smsPRO branding across all screens and user interface
          files: |
            build-output/smsPRO-2.0.0.apk
            build-output/smsPRO-debug.apk
            build-output/CuponApp-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
