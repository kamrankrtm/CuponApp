name: Build CuponApp APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Make Gradle script executable
        run: chmod +x ./gradlew

      - name: Build Debug APK (noAnalytics)
        run: ./gradlew assembleNoAnalyticsDebug --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          find presentation/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/smsPRO-1.0.14.apk \;
          cp build-output/smsPRO-1.0.14.apk build-output/smsPRO-debug.apk
          cp build-output/smsPRO-1.0.14.apk build-output/CuponApp-debug.apk
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smsPRO-debug-apk
          path: build-output/smsPRO-1.0.14.apk
          retention-days: 30

      - name: Create GitHub Release (on every main push)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.14-${{ github.run_number }}
          name: smsPRO v1.0.14 (build ${{ github.run_number }})
          body: |
            ## smsPRO v1.0.14 - Samsung S25 / Android 15 & Instant Inbox Update
            - Added `android:extractNativeLibs="true"` to resolve Realm UnsatisfiedLinkError on Android 15 / Samsung S25
            - Crash process isolation via `isCrashProcess()` guard in QKApplication to prevent secondary crash loops
            - Instant Inbox view: default tab (index 0) set to "همه" (All Messages) with immediate data rendering
            - Tab order: All ("همه"), Personal ("شخصی"), Banking ("بانکی"), OTP ("رمز ورود"), Promo Codes ("کدهای تخفیف"), Spam ("تبلیغات")
            - Safe NDK symbol handling to guarantee all native Realm libraries are packed
          files: |
            build-output/smsPRO-1.0.14.apk
            build-output/smsPRO-debug.apk
            build-output/CuponApp-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

