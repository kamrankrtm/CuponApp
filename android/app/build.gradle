apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

/**
 * کلید امضای ثابت.
 *
 * اندروید اجازه نمی‌دهد اپی که با یک کلید امضا شده، با APK ای که کلید
 * دیگری دارد جایگزین شود. کلید debug روی رانر CI هر بار از نو ساخته
 * می‌شود، پس هر بیلد امضای متفاوتی می‌گرفت و نصب روی نسخه قبلی با خطای
 * «App not installed» شکست می‌خورد. اینجا اگر کلید واقعی از طریق متغیرهای
 * محیطی در دسترس باشد از آن استفاده می‌شود.
 */
def keystoreFile = file("cuponapp-release.keystore")

// رمزها از دو جا خوانده می‌شوند: متغیر محیطی (که گردش‌کار از Secret مخزن
// پر می‌کند) و در نبود آن، فایل keystore.properties کنار پروژه. اولویت با
// متغیر محیطی است تا بتوان رمز را از مخزن بیرون نگه داشت.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def storePass = System.getenv("KEYSTORE_PASSWORD") ?: keystoreProps.getProperty("storePassword")
def keyPass = System.getenv("KEY_PASSWORD") ?: keystoreProps.getProperty("keyPassword")
def keyAliasName = System.getenv("KEY_ALIAS") ?: keystoreProps.getProperty("keyAlias") ?: "cuponapp"

def hasReleaseKey = keystoreFile.exists() && storePass != null && keyPass != null

android {
    namespace = "com.cuponapp.smsdiscounts"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.cuponapp.smsdiscounts"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // نسخه از گردش‌کار CI می‌آید؛ بیلد محلی روی ۱ می‌ماند
        versionCode System.getenv("ANDROID_VERSION_CODE") ? System.getenv("ANDROID_VERSION_CODE").toInteger() : 1
        versionName System.getenv("APP_VERSION") ?: "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile keystoreFile
                storePassword storePass
                keyAlias keyAliasName
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // بدون کلید واقعی، بیلد محلی با کلید debug کار می‌کند ولی
            // نصب روی نسخه قبلی ممکن نخواهد بود.
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
